<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garabatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family: 'Caveat', 'Comic Sans MS', cursive;
        background: linear-gradient(170deg, rgba(255, 255, 255, 0.97), rgba(239, 236, 225, 0.99));
        color: rgba(0, 0, 0, 0.94);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(32px, 8vw, 96px);
        line-height: 1.45;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.2rem;
        color: rgba(0, 0, 0, 0.98);
        font-size: clamp(3.2rem, 9vw, 6rem);
        font-weight: 700;
        line-height: 1;
      }

      .byline {
        margin: 0 0 2.6rem;
        color: rgba(0, 0, 0, 0.7);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        font-style: italic;
      }

      .quote {
        position: relative;
        z-index: 0;
        margin: 0;
        font-size: clamp(1.7rem, 3.6vw, 2.7rem);
        line-height: 1.4;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.96);
      }

      /* Oversized magazine-style opening quote sitting behind the text */
      .quote::before {
        content: "\201C";
        position: absolute;
        z-index: -1;
        top: -0.32em;
        left: 0;
        font-size: 6.5em;
        line-height: 1;
        color: rgba(67, 67, 67, 0.16);
        pointer-events: none;
      }

      .divider {
        width: 56px;
        height: 2px;
        margin: 2.4rem 0;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
      }

      .translation {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.1rem, 2.1vw, 1.4rem);
        line-height: 1.55;
        color: rgba(0, 0, 0, 0.7);
        font-style: italic;
      }

      #overlay-close {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.85);
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(0, 0, 0, 0.18);
        border-radius: 999px;
        cursor: pointer;
        opacity: 0.6;
        backdrop-filter: blur(8px);
        font-family: system-ui, sans-serif;
        transition: opacity 0.15s ease;
      }
      #overlay-close:hover { opacity: 1; }
      html.gi-tab #overlay-close { display: none; }
    </style>
    <script>if(new URLSearchParams(location.search).get("chrome")==="tab")document.documentElement.classList.add("gi-tab");</script>
  </head>
  <body>
    <button id="overlay-close" onclick="window.parent.postMessage({type:'overlay:close'},'*')">Cerrar</button>
    <main>
      <h1>Marginalia</h1>
      <p class="byline">Juan Bautista Aballay, 2023 – 2026</p>

      <blockquote class="quote">
        Oda a los dibujos en los márgenes de la libreta, a los garabatos hechos en infinidad de clases. 
      </blockquote>

      <hr class="divider" />

      <p class="translation">An ode to the drawings in the margins of the notebook, to the doodles made across countless classes.</p>
    </main>
    <script>window.parent.postMessage({type:'overlay:accent',bg:'rgb(245, 243, 236)'},'*')</script>
  </body>
</html>
